[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milli-scrapes"
version = "0.1.0"
description = "Ultra-Fast Visual Web Scraper, Change Monitor, and Reflex Seat Booking Engine"
readme = "README.md"
authors = [{ name = "Abdullah-Al-Raju", email = "analystx.raju@gmail.com" }]
license = { text = "Free for Personal and Academic Evaluation" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pillow>=9.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "milli-agent>=0.1.0"
]

[project.scripts]
milli-scrape = "milli_scrapes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["milli_scrapes*"]
