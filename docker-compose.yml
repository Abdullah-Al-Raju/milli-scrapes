version: '3.8'

services:
  milli-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: milli-scrape-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MILLI_API_KEY=${MILLI_API_KEY:-}
    shm_size: '256mb'
    deploy:
      resources:
        limits:
          memory: 512M
